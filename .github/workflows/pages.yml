name: Website

on:
  push:
    branches: [main]
    # The site, plus the repo files its pages are generated from.
    paths:
      - site/**
      - tools/site/**
      - CHANGELOG.md
      - docs/fidelity.md
      - docs/formulas.md
      - Cargo.toml
      - macos/Sources/Waffle/App/MainMenu.swift
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build the site
        run: python3 tools/site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
