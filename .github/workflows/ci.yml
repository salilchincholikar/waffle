name: CI

on:
  push:
    branches: [main]
    # Website, docs and Markdown-only changes can't break the build: skip the macOS run.
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30  # a hang fails fast instead of running for hours
    steps:
      - uses: actions/checkout@v5
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: make lint
      - name: Rust tests
        run: make test-rust
      - name: Swift tests
        run: make test-swift
      - name: App self-test
        run: make selftest
      - name: Build app
        run: make app
