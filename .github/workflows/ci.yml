name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: make lint
      - name: Rust tests
        run: make test-rust
      - name: Swift tests
        run: make test-swift
      - name: App self-test
        run: make selftest
      - name: Build app
        run: make app
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Waffle.app
          path: build/Waffle.app
